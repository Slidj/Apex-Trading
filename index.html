<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Safe Area Max</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        :root {
            --bg-color: #131722;
            --panel-bg: #1e222d;
            --text-primary: #ffffff;
            --text-secondary: #787b86;
            --accent-green: #0faf59;
            --accent-red: #ff4a68;
            --accent-blue: #0099ff;
            --bet-gold: #ffcf00; 
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        /* HEADER - МАКСИМАЛЬНИЙ ВІДСТУП (90px + Safe Area) */
        .header {
            position: absolute; top: 0; left: 0; right: 0; 
            height: auto; 
            min-height: 80px;
            
            padding: 0 16px;
            /* 🔥 ТУТ ЗМІНА: 90px бази + системний відступ */
            padding-top: calc(90px + env(safe-area-inset-top)); 
            padding-bottom: 10px;

            display: flex; justify-content: space-between; align-items: flex-start;
            z-index: 10; 
            background: linear-gradient(180deg, rgba(19, 23, 34, 0.95) 0%, rgba(19, 23, 34, 0) 100%);
            pointer-events: none; 
        }

        .header > * { pointer-events: auto; }

        /* ПРОФІЛЬ */
        .user-profile { 
            display: flex; align-items: center; gap: 10px; 
            background: rgba(30, 34, 45, 0.9); 
            padding: 4px 12px 4px 4px; 
            border-radius: 30px; border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        .user-avatar { 
            width: 38px; height: 38px; border-radius: 50%; 
            background: #333; object-fit: cover; 
            border: 1px solid rgba(255,255,255,0.2);
        }
        .user-name { font-weight: 700; font-size: 14px; color: white; }

        /* ПРАВА ЧАСТИНА */
        .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

        .asset-btn {
            display: flex; flex-direction: column; align-items: flex-end;
            background: rgba(30, 34, 45, 0.6); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 4px 8px;
            backdrop-filter: blur(5px);
        }
        .asset-name { font-size: 14px; font-weight: 700; color: white; display: flex; align-items: center; gap: 4px; }
        .asset-payout { font-size: 10px; color: var(--accent-green); font-weight: 700; }
        
        .balance-box {
            text-align: right; background: rgba(30, 34, 45, 0.9); 
            padding: 4px 10px; border-radius: 6px;
            border: 1px solid var(--bet-gold);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance-val { font-size: 14px; font-weight: 800; color: var(--bet-gold); letter-spacing: 0.5px; }

        /* CHART AREA */
        #chart-container {
            position: absolute; top: 0; left: 0; right: 0; bottom: 80px; z-index: 1;
        }

        /* FLOATING CHART CONTROLS - ОПУЩЕНІ ЩЕ НИЖЧЕ */
        .chart-controls {
            position: absolute; 
            /* Відсунули до 180px, бо хедер тепер займає багато місця */
            top: 180px; 
            left: 16px; z-index: 5;
            display: flex; flex-direction: column; gap: 8px;
        }
        .control-btn {
            width: 36px; height: 36px; border-radius: 8px; background: var(--panel-bg);
            border: 1px solid var(--border-color); color: var(--text-secondary);
            display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.2s;
        }
        .control-btn.active { color: white; border-color: white; background: #2a2e39; }

        /* BOTTOM TRADING PANEL */
        .trade-panel {
            position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
            background: var(--panel-bg); border-top: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 12px; padding-bottom: env(safe-area-inset-bottom);
            z-index: 20;
        }

        .trade-inputs { display: flex; gap: 8px; flex: 1; margin-right: 12px; }
        
        .input-group {
            flex: 1; background: #2a2e39; border-radius: 8px; padding: 6px 10px;
            display: flex; flex-direction: column; justify-content: center;
            border: 1px solid var(--border-color); position: relative; cursor: pointer;
        }
        .input-label { font-size: 10px; color: var(--text-secondary); font-weight: 600; }
        .input-value { font-size: 15px; font-weight: 700; color: white; }
        
        /* Selectors */
        .selector-overlay {
            position: absolute; bottom: 90px; left: 16px; background: var(--panel-bg);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 10px;
            display: none; flex-direction: column; gap: 5px; z-index: 50; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .selector-overlay.show { display: flex; }
        .select-option {
            padding: 10px 20px; font-size: 14px; font-weight: 600; color: white;
            border-radius: 6px; text-align: center; cursor: pointer;
        }
        .select-option.active { background: var(--accent-blue); }

        /* BUY/SELL BUTTONS */
        .trade-buttons { display: flex; gap: 8px; width: 140px; }
        .trade-btn {
            flex: 1; height: 50px; border-radius: 10px; border: none; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.1s;
        }
        .trade-btn:active { transform: scale(0.95); }
        .btn-up { background: var(--accent-green); }
        .btn-down { background: var(--accent-red); }
        .btn-icon { font-size: 18px; line-height: 1; color: white; font-weight: 900; }
        
        /* RESULT POPUP */
        .result-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: var(--panel-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--border-color);
            text-align: center; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); min-width: 200px;
        }
        .result-modal.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .res-title { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .res-val { font-size: 28px; font-weight: 900; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img id="user-avatar" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555'%3E%3Crect width='24' height='24' fill='%23333'/%3E%3C/svg%3E" class="user-avatar">
            <div class="user-name" id="user-name">Trader</div>
        </div>

        <div class="header-right">
            <button class="asset-btn" id="asset-btn">
                <span class="asset-name">BTC/USDT <span style="font-size:10px">▼</span></span>
                <span class="asset-payout">82% payout</span>
            </button>
            <div class="balance-box">
                <span class="balance-val" id="balance">$1,000.00</span>
            </div>
        </div>
    </div>

    <div class="chart-controls">
        <div class="control-btn active" onclick="setChartTF(1, this)">5s</div>
        <div class="control-btn" onclick="setChartTF(15, this)">15s</div>
        <div class="control-btn" onclick="setChartTF(60, this)">1m</div>
        <div class="control-btn" onclick="resetZoom()" style="margin-top: 10px;">🎯</div>
    </div>

    <div id="chart-container"></div>

    <div id="time-selector" class="selector-overlay" style="bottom: 90px; left: 12px;">
        <div class="select-option" onclick="setTradeTime(10)">00:10</div>
        <div class="select-option active" onclick="setTradeTime(30)">00:30</div>
        <div class="select-option" onclick="setTradeTime(60)">01:00</div>
    </div>

    <div id="amount-selector" class="selector-overlay" style="bottom: 90px; left: 100px;">
        <div class="select-option" onclick="setTradeAmount(10)">$10</div>
        <div class="select-option active" onclick="setTradeAmount(50)">$50</div>
        <div class="select-option" onclick="setTradeAmount(100)">$100</div>
    </div>

    <div class="trade-panel">
        <div class="trade-inputs">
            <div class="input-group" onclick="toggleSelector('time-selector')">
                <span class="input-label">Time</span>
                <span class="input-value" id="time-display">00:30</span>
            </div>
            <div class="input-group" onclick="toggleSelector('amount-selector')">
                <span class="input-label">Invest</span>
                <span class="input-value" id="amount-display">$50</span>
            </div>
        </div>

        <div class="trade-buttons">
            <button class="trade-btn btn-down" onclick="startTrade('DOWN')">
                <span class="btn-icon">↓</span>
            </button>
            <button class="trade-btn btn-up" onclick="startTrade('UP')">
                <span class="btn-icon">↑</span>
            </button>
        </div>
    </div>

    <div id="result-modal" class="result-modal">
        <div class="res-title" id="res-title">Result</div>
        <div class="res-val" id="res-val">$0</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#131722');

        const CONFIG = {
            up: '#0faf59', down: '#ff4a68', bg: '#131722', grid: 'rgba(255,255,255,0.03)',
            bet: '#ffcf00' // Gold
        };

        // --- USER DATA ---
        const user = tg.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name || 'Trader';
            if (user.photo_url) document.getElementById('user-avatar').src = user.photo_url;
        }

        // --- STATE ---
        let currentChartTF = 1; 
        let tradeDuration = 30; 
        let tradeAmount = 50;
        let lastPrice = 0;
        let balance = 1000;

        // --- CHART INIT ---
        const container = document.getElementById('chart-container');
        const chart = LightweightCharts.createChart(container, {
            layout: { background: { type: 'solid', color: 'transparent' }, textColor: '#787b86', fontSize: 11 },
            grid: { vertLines: { color: CONFIG.grid }, horzLines: { color: CONFIG.grid } },
            priceScale: { autoScale: true, scaleMargins: { top: 0.2, bottom: 0.2 } },
            timeScale: { timeVisible: true, secondsVisible: true, barSpacing: 12, minBarSpacing: 5, borderColor: 'transparent' },
            crosshair: { mode: 1, vertLine: { style: 3, width: 1, color: '#555', labelBackgroundColor: '#555' }, horzLine: { style: 3, width: 1, color: '#555', labelBackgroundColor: '#555' } }
        });

        const series = chart.addCandlestickSeries({
            upColor: CONFIG.up, borderUpColor: CONFIG.up, wickUpColor: CONFIG.up,
            downColor: CONFIG.down, borderDownColor: CONFIG.down, wickDownColor: CONFIG.down,
        });

        window.onresize = () => chart.resize(container.clientWidth, container.clientHeight);
        function resetZoom() { chart.timeScale().scrollToRealTime(); }

        // --- DATA STREAM ---
        let ws = null;
        let rawCandle = null;

        function connectWebSocket(symbol) {
            if (ws) ws.close();
            series.setData([]);
            rawCandle = null;

            ws = new WebSocket(`wss://stream.binance.com:9443/ws/${symbol}@aggTrade`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const price = parseFloat(data.p);
                const time = Math.floor(data.T / (currentChartTF * 1000)) * currentChartTF;

                if (!rawCandle || time > rawCandle.time) {
                    rawCandle = { time: time, open: rawCandle ? rawCandle.close : price, high: price, low: price, close: price };
                } else {
                    rawCandle.high = Math.max(rawCandle.high, price);
                    rawCandle.low = Math.min(rawCandle.low, price);
                    rawCandle.close = price;
                }

                series.update(rawCandle);
                
                const digits = price < 1 ? 5 : 2; 
                series.applyOptions({ priceFormat: { precision: digits, minMove: 1/Math.pow(10, digits) } });
                lastPrice = price;
            };
        }
        connectWebSocket('btcusdt');

        // --- CONTROLS LOGIC ---
        window.setChartTF = (seconds, btn) => {
            currentChartTF = seconds;
            series.setData([]); rawCandle = null;
            document.querySelectorAll('.control-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
        };

        window.toggleSelector = (id) => {
            const el = document.getElementById(id);
            document.querySelectorAll('.selector-overlay').forEach(s => { if(s.id !== id) s.classList.remove('show'); });
            el.classList.toggle('show');
        };

        window.setTradeTime = (seconds) => {
            tradeDuration = seconds;
            const min = Math.floor(seconds / 60).toString().padStart(2, '0');
            const sec = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('time-display').innerText = `${min}:${sec}`;
            document.querySelectorAll('#time-selector .select-option').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('time-selector').classList.remove('show');
        };

        window.setTradeAmount = (amount) => {
            tradeAmount = amount;
            document.getElementById('amount-display').innerText = `$${amount}`;
            document.querySelectorAll('#amount-selector .select-option').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('amount-selector').classList.remove('show');
        };

        // --- TRADING LOGIC (GOLD LINE FIXED) ---
        window.startTrade = (direction) => {
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            const entryPrice = lastPrice;
            const endTime = Date.now() + (tradeDuration * 1000);
            
            // Використовуємо ЗОЛОТИЙ колір для лінії ставки
            const color = CONFIG.bet; 
            const arrow = direction === 'UP' ? '▲' : '▼';
            
            const line = series.createPriceLine({
                price: entryPrice, color: color, lineWidth: 2, lineStyle: 2,
                title: `${arrow} $${tradeAmount}`,
                axisLabelVisible: true,
                axisLabelColor: color, // Золота плашка
                axisLabelTextColor: '#000000' // Чорний текст на золоті
            });

            const interval = setInterval(() => {
                const remaining = Math.ceil((endTime - Date.now()) / 1000);
                
                if (remaining <= 0) {
                    clearInterval(interval);
                    finishTrade(line, direction, entryPrice);
                } else {
                    line.applyOptions({ title: `${arrow} ${remaining}s` });
                }
            }, 1000);
        };

        function finishTrade(line, direction, entryPrice) {
            let win = false;
            if (direction === 'UP' && lastPrice > entryPrice) win = true;
            else if (direction === 'DOWN' && lastPrice < entryPrice) win = true;

            const profit = tradeAmount * 0.82;
            
            if (win) balance += profit; 
            else balance -= tradeAmount;
            
            document.getElementById('balance').innerText = `$${balance.toFixed(2)}`;
            series.removePriceLine(line);
            showResult(win, win ? profit : tradeAmount);
        }

        function showResult(win, amount) {
            const modal = document.getElementById('result-modal');
            const title = document.getElementById('res-title');
            const val = document.getElementById('res-val');

            title.innerText = win ? 'PROFIT' : 'LOSS';
            title.style.color = win ? CONFIG.up : CONFIG.down;
            val.innerText = (win ? '+' : '-') + `$${amount.toFixed(2)}`;
            val.style.color = win ? CONFIG.up : CONFIG.down;
            
            modal.style.borderColor = win ? CONFIG.up : CONFIG.down;
            modal.classList.add('show');

            if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred(win ? 'success' : 'error');
            setTimeout(() => { modal.classList.remove('show'); }, 2000);
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.input-group') && !e.target.closest('.selector-overlay')) {
                document.querySelectorAll('.selector-overlay').forEach(s => s.classList.remove('show'));
            }
        });
    </script>
</body>
</html>
