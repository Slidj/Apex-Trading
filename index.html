<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apex Pro Realism</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Стиль для поля вводу суми */
        .custom-input-wrapper {
            padding: 10px 15px; border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; gap: 5px;
        }
        .custom-input {
            width: 100%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px; border-radius: 6px; font-weight: 700; outline: none;
            font-size: 16px; text-align: center;
        }
        .custom-input:focus { border-color: #0099ff; background: rgba(0, 153, 255, 0.1); }
        
        .apply-btn {
            background: #0099ff; color: white; border: none; border-radius: 6px;
            font-weight: 700; padding: 0 15px; cursor: pointer;
        }

        /* SVG Іконки для кнопок */
        .btn-icon-svg {
            width: 24px; height: 24px; fill: white;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="user-profile">
            <img id="user-avatar" src="" class="user-avatar">
            <div class="user-name" id="user-name">Trader</div>
        </div>

        <div class="header-right">
            <button class="asset-btn" id="asset-btn" onclick="toggleSelector('asset-selector')">
                <span class="asset-name" id="current-asset">BTC/USDT <span style="font-size:10px">▼</span></span>
                <span class="asset-payout" id="current-payout">82% payout</span>
            </button>
            <div class="balance-box">
                <span class="balance-val" id="balance">$1,000.00</span>
            </div>
        </div>
    </div>

    <div class="sentiment-bar">
        <div class="sentiment-fill up" id="sentiment-up" style="height: 50%"></div>
        <div class="sentiment-fill down" id="sentiment-down" style="height: 50%"></div>
    </div>

    <div id="asset-selector" class="selector-overlay">
        <div class="select-option active" onclick="setAsset('btcusdt', 'BTC/USDT', '82%')">
            BTC/USDT <span style="font-size:11px; color:#0faf59">82%</span>
        </div>
        <div class="select-option" onclick="setAsset('ethusdt', 'ETH/USDT', '78%')">
            ETH/USDT <span style="font-size:11px; color:#0faf59">78%</span>
        </div>
        <div class="select-option" onclick="setAsset('solusdt', 'SOL/USDT', '75%')">
            SOL/USDT <span style="font-size:11px; color:#0faf59">75%</span>
        </div>
        <div class="select-option" onclick="setAsset('dogeusdt', 'DOGE/USDT', '70%')">
            DOGE/USDT <span style="font-size:11px; color:#0faf59">70%</span>
        </div>
    </div>

    <div class="chart-controls">
        <div class="control-btn active" onclick="setChartTF(1, this)">5s</div>
        <div class="control-btn" onclick="setChartTF(15, this)">15s</div>
        <div class="control-btn" onclick="setChartTF(60, this)">1m</div>
        <div class="control-btn" onclick="resetZoom()" style="margin-top: 10px;">🎯</div>
    </div>

    <div id="chart-container"></div>

    <div id="time-selector" class="selector-overlay" style="bottom: 90px; left: 12px;">
        <div class="select-option" onclick="setTradeTime(10)">00:10</div>
        <div class="select-option active" onclick="setTradeTime(30)">00:30</div>
        <div class="select-option" onclick="setTradeTime(60)">01:00</div>
    </div>

    <div id="amount-selector" class="selector-overlay" style="bottom: 90px; left: 100px; min-width: 160px;">
        <div class="select-option" onclick="setTradeAmount(10)">$10</div>
        <div class="select-option active" onclick="setTradeAmount(50)">$50</div>
        <div class="select-option" onclick="setTradeAmount(100)">$100</div>
        
        <div class="custom-input-wrapper" onclick="event.stopPropagation()">
            <input type="number" id="manual-amount" class="custom-input" placeholder="Sum" onchange="applyManualAmount()">
            <button class="apply-btn" onclick="applyManualAmount()">OK</button>
        </div>
    </div>

    <div class="trade-panel">
        <div class="trade-inputs">
            <div class="input-group" onclick="toggleSelector('time-selector')">
                <span class="input-label">Time</span>
                <span class="input-value" id="time-display">00:30</span>
            </div>
            <div class="input-group" onclick="toggleSelector('amount-selector')">
                <span class="input-label">Invest</span>
                <span class="input-value" id="amount-display">$50</span>
            </div>
        </div>

        <div class="trade-buttons">
            <button class="trade-btn btn-down" onclick="startTrade('DOWN')">
                <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 21l-8-8h6v-9h4v9h6l-8 8z"/></svg>
            </button>
            <button class="trade-btn btn-up" onclick="startTrade('UP')">
                <svg class="btn-icon-svg" viewBox="0 0 24 24"><path d="M12 3l8 8h-6v9h-4v-9h-6l8-8z"/></svg>
            </button>
        </div>
    </div>

    <div id="result-modal" class="result-modal">
        <div class="res-title" id="res-title">Result</div>
        <div class="res-val" id="res-val">$0</div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
